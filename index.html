<!DOCTYPE html>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f2f2f7; color: #1c1c1e; padding: 10px; padding-bottom: 100px; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .top-bar h1 { font-size: 1.1rem; }
        .top-bar .stats { font-size: 0.8rem; color: #8e8e93; }
        
        .scroll-x { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
        .scroll-x::-webkit-scrollbar { display: none; }
        .btn-pill { white-space: nowrap; padding: 6px 14px; background: #fff; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; cursor: pointer; }
        .btn-pill.active { background: #007aff; color: #fff; border-color: #007aff; }
        
        .word-card { background: #fff; border: 1px solid #e5e5ea; padding: 38px 12px 12px 12px; margin-bottom: 8px; position: relative; cursor: pointer; border-radius: 8px; }
        .word-jp { font-size: 1.3rem; font-weight: bold; }
        .word-kana { font-size: 0.95rem; color: #666; margin-top: 2px; }
        .word-romaji { font-size: 0.85rem; color: #999; margin-top: 2px; }
        .word-cn { font-size: 1rem; color: #007aff; margin-top: 6px; }
        .word-type { font-size: 0.75rem; background: #ff9500; color: #fff; padding: 2px 6px; position: absolute; top: 10px; left: 12px; border-radius: 4px; }
        .speaker-btn { position: absolute; right: 12px; top: 16px; background: #e5f0ff; border: 1px solid #007aff; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; color: #007aff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .word-details { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e5e5ea; background: #fafafa; padding: 10px; border-radius: 6px; }
        .word-card.open .word-details { display: block; }
        .conjugation-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #ddd; font-size: 0.9rem; }
        .conjugation-item:last-child { border-bottom: none; }
        
        .grammar-item { background: #fff; border: 1px solid #e5e5ea; margin-bottom: 8px; border-radius: 8px; }
        .grammar-header { padding: 12px; font-weight: bold; cursor: pointer; }
        .grammar-body { display: none; padding: 12px; background: #fafafa; border-top: 1px solid #e5e5ea; }
        .grammar-item.open .grammar-body { display: block; }
        .grammar-desc { font-size: 0.9rem; background: #e5f0ff; padding: 8px; border-radius: 6px; margin-bottom: 10px; }
        .example { background: #fff; padding: 10px; margin-bottom: 6px; border-left: 3px solid #007aff; }
        .example .jp { font-weight: bold; font-size: 0.95rem; }
        .example .romaji { font-size: 0.85rem; color: #999; margin: 2px 0; }
        .example .cn { font-size: 0.9rem; color: #666; }
        
        /* 🌟 修复后的测试界面 */
        .quiz-container { width: 100%; display: flex; flex-direction: column; padding-bottom: 20px; }
        .quiz-tabs { display: flex; border-bottom: 2px solid #e5e5ea; margin-bottom: 15px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .quiz-tabs::-webkit-scrollbar { display: none; }
        .quiz-tabs button { flex: 0 0 auto; white-space: nowrap; background: none; border: none; padding: 12px 14px; font-size: 0.85rem; font-weight: bold; color: #8e8e93; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .quiz-tabs button.active { color: #007aff; border-bottom: 2px solid #007aff; }
        .quiz-question-box { background: #fff; border: 1px solid #e5e5ea; padding: 30px 15px; text-align: center; margin-bottom: 10px; border-radius: 8px; }
        .quiz-question-box .q-text { font-size: 1.8rem; font-weight: bold; word-break: break-all; }
        .quiz-question-box .q-sub { color: #666; margin-top: 5px; }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .quiz-options button { display: block; width: 100%; background: #fff; border: 1px solid #ccc; padding: 15px; text-align: left; font-size: 1rem; border-radius: 6px; cursor: pointer; word-break: break-all; }
        .quiz-options button.correct { background: #e5f9e5; border-color: #34c759; color: #34c759; }
        .quiz-options button.wrong { background: #ffe5e5; border-color: #ff3b30; color: #ff3b30; }
        .quiz-result { text-align: center; background: #fff; padding: 30px; border-radius: 8px; border: 1px solid #e5e5ea; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #fff; border-top: 1px solid #ccc; display: flex; z-index: 999; padding-bottom: env(safe-area-inset-bottom, 20px); }
        .nav-item { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.8rem; color: #8e8e93; cursor: pointer; }
        .nav-item.active { color: #007aff; }
        .nav-item .icon { font-size: 1.4rem; }
    </style>
</head>

    <div class="top-bar"><h1 id="pageTitle">第1课</h1><div class="stats" id="statsInfo">1 / 25</div></div>

<script>
    // ==========================================
    // 语法补充题库（当课程语法数据不足时使用）
    // ==========================================
    const grammarBackupQuestions = [
        { jp: "わたしは マイク・ミラーです。", cn: "我是迈克·米勒。" },
        { jp: "サントスさんは 学生じゃ ありません。", cn: "桑托斯不是学生。" },
        { jp: "ミラーさんは アメリカ人ですか。", cn: "米勒是美国人吗？" },
        { jp: "グプタさんも 会社員です。", cn: "古普塔也是公司职员。" },
        { jp: "ミラーさんは IMCの 社員です。", cn: "米勒是IMC公司的职员。" },
        { jp: "それは 辞書ですか。", cn: "那是字典吗？" },
        { jp: "この 本は わたしのです。", cn: "这本书是我的。" },
        { jp: "これは コンピューターの 本です。", cn: "这是计算机的书。" },
        { jp: "お手洗いは あそこです。", cn: "洗手间在那边。" },
        { jp: "山田さんは 事務所です。", cn: "山田在事务所。" }
    ];

    // ==========================================
    // 数据区（100% 全量数据，请逐段拼接）
    // ==========================================
    const masterData = {};
    
    // ----------------- 第 1 课 全量数据 -----------------
    masterData["1"] = { v: [["わたし","わたし","我","noun"],["あなた","あなた","你","noun"],["あの ひと","あの ひと","那个人","noun"],["先生","せんせい","老师","noun"],["学生","がくせい","学生","noun"],["会社員","かいしゃいん","公司职员","noun"],["銀行員","ぎんこういん","银行职员","noun"],["医者","いしゃ","医生","noun"],["研究者","けんきゅうしゃ","研究人员","noun"],["大学","だいがく","大学","noun"],["病院","びょういん","医院","noun"],["だれ","だれ","谁","other"],["どなた","どなた","哪位","other"],["～歳","～さい","～岁","other"],["何歳","なんさい","几岁","other"],["はい","はい","是","other"],["いいえ","いいえ","不是","other"],["アメリカ","アメリカ","美国","noun"],["イギリス","イギリス","英国","noun"],["インド","インド","印度","noun"],["インドネシア","インドネシア","印度尼西亚","noun"],["韓国","かんこく","韩国","noun"],["タイ","タイ","泰国","noun"],["中国","ちゅうごく","中国","noun"],["ドイツ","ドイツ","德国","noun"],["日本","にほん","日本","noun"],["ブラジル","ブラジル","巴西","noun"],["～さん","～さん","先生/女士","other"],["～ちゃん","～ちゃん","小~","other"],["～じん","～じん","~人","other"]], g: [{ r:"名词1 は 名词2 です", d:"【中式理解】表示判断，相当于“A是B”。助词「は」读作「wa」。", e:[["わたしは マイク・ミラーです。","我是迈克·米勒。"],["わたしは 会社員です。","我是公司职员。"]] },{ r:"名词1 は 名词2 じゃ（では） ありません", d:"【中式理解】「です」的否定形式。口语常用「じゃ」，正式场合用「では」。", e:[["サントスさんは 学生じゃ ありません。","桑托斯不是学生。"]] },{ r:"名词1 は 名词2 ですか", d:"【中式理解】句尾加「か」变成疑问句。肯定回答「はい」，否定回答「いいえ」。", e:[["ミラーさんは アメリカ人ですか。","米勒是美国人吗？"]] },{ r:"名词も", d:"【中式理解】「も」相当于中文的“也”。", e:[["ミラーさんは 会社員です。","米勒是公司职员。"],["グプタさんも 会社員です。","古普塔也是公司职员。"]] },{ r:"名词1 の 名词2", d:"【中式理解】相当于中文的“的”。前面的名词1修饰后面的名词2。", e:[["ミラーさんは IMCの 社員です。","米勒是IMC公司的职员。"]] },{ r:"～さん", d:"【中式理解】加在听话人或第三者姓名后，表敬意。不能加在自己名字后。", e:[["あの 方は ミラーさんです。","那位是米勒先生。"]] }] };

    // ----------------- 第 2 课 全量数据 -----------------
    masterData["2"] = { v: [["これ","これ","这","other"],["それ","それ","那","other"],["あれ","あれ","那(远)","other"],["この","この","这个(后接名词)","other"],["その","その","那个(后接名词)","other"],["あの","あの","那个(后接名词)","other"],["本","ほん","书","noun"],["辞書","じしょ","字典","noun"],["雑誌","ざっし","杂志","noun"],["新聞","しんぶん","报纸","noun"],["ノート","ノート","笔记本","noun"],["手帳","てちょう","记事本","noun"],["名刺","めいし","名片","noun"],["カード","カード","卡片","noun"],["鉛筆","えんぴつ","铅笔","noun"],["ボールペン","ボールペン","圆珠笔","noun"],["シャープペンシル","シャープペンシル","自动铅笔","noun"],["鍵","かぎ","钥匙","noun"],["時計","とけい","钟表","noun"],["傘","かさ","伞","noun"],["かばん","かばん","包","noun"],["CD","シーディー","CD","noun"],["テレビ","テレビ","电视","noun"],["ラジオ","ラジオ","收音机","noun"],["カメラ","カメラ","照相机","noun"],["コンピューター","コンピューター","电脑","noun"],["車","くるま","汽车","noun"],["机","つくえ","桌子","noun"],["椅子","いす","椅子","noun"],["チョコレート","チョコレート","巧克力","noun"],["コーヒー","コーヒー","咖啡","noun"],["英語","えいご","英语","noun"],["日本語","にほんご","日语","noun"],["～語","～ご","～语","other"],["何","なん","什么","other"],["そう","そう","是","other"]], g: [{ r:"これ / それ / あれ", d:"【中式理解】指示代词。独自成句，后面不接名词。", e:[["それは 辞書ですか。","那是字典吗？"]] },{ r:"この / その / あの + 名词", d:"【中式理解】修饰名词时使用，表示“这个/那个……”。", e:[["この 本は わたしのです。","这本书是我的。"]] },{ r:"名词1 の 名词2", d:"【中式理解】表示所属或属性，相当于中文的“的”。", e:[["これは コンピューターの 本です。","这是计算机的书。"]] },{ r:"そうですか", d:"【中式理解】听到新信息时，表示“噢，是这样啊”，降调读。", e:[["この 傘は あなたのですか。","这把伞是你的吗？"]] }] };

    // ----------------- 第 3 课 全量数据 -----------------
    masterData["3"] = { v: [["ここ","ここ","这里","other"],["そこ","そこ","那里","other"],["あそこ","あそこ","那里(远)","other"],["どこ","どこ","哪里","other"],["こちら","こちら","这边","other"],["そちら","そちら","那边","other"],["あちら","あちら","那边(远)","other"],["どちら","どちら","哪边","other"],["教室","きょうしつ","教室","noun"],["食堂","しょくどう","食堂","noun"],["事務所","じむしょ","事务所","noun"],["会議室","かいぎしつ","会议室","noun"],["受付","うけつけ","接待处","noun"],["ロビー","ロビー","大厅","noun"],["部屋","へや","房间","noun"],["トイレ","トイレ","厕所","noun"],["階段","かいだん","楼梯","noun"],["エレベーター","エレベーター","电梯","noun"],["エスカレーター","エスカレーター","自动扶梯","noun"],["自動販売機","じどうはんばいき","自动售货机","noun"],["電話","でんわ","电话","noun"],["国","くに","国家","noun"],["会社","かいしゃ","公司","noun"],["うち","うち","家","noun"],["靴","くつ","鞋","noun"],["ネクタイ","ネクタイ","领带","noun"],["ワイン","ワイン","葡萄酒","noun"],["売り場","うりば","售货处","noun"],["地下","ちか","地下","noun"],["～階","～かい","～层","other"],["～円","～えん","～日元","other"],["いくら","いくら","多少钱","other"],["百","ひゃく","百","other"],["千","せん","千","other"],["万","まん","万","other"]], g: [{ r:"ここ / そこ / あそこ / どこ", d:"【中式理解】指示场所的代词。", e:[["お手洗いは あそこです。","洗手间在那边。"]] },{ r:"名词 は 场所 です", d:"【中式理解】表示人或物存在的场所。", e:[["山田さんは 事務所です。","山田在事务所。"]] },{ r:"どこ / どちら", d:"【中式理解】询问场所。「どちら」是「どこ」的礼貌说法。", e:[["お手洗いは どこですか。","洗手间在哪里？"]] }] };

    // ----------------- 第 4 课 全量数据 -----------------
    masterData["4"] = { v: [["起きます","おきます","起床","verb"],["寝ます","ねます","睡觉","verb"],["働きます","はたらきます","工作","verb"],["休みます","やすみます","休息","verb"],["勉強します","べんきょうします","学习","verb"],["終わります","おわります","结束","verb"],["デパート","デパート","百货商店","noun"],["銀行","ぎんこう","银行","noun"],["郵便局","ゆうびんきょく","邮局","noun"],["図書館","としょかん","图书馆","noun"],["美術館","びじゅつかん","美术馆","noun"],["今","いま","现在","other"],["～時","～じ","～点","other"],["～分","～ふん","～分","other"],["半","はん","半","other"],["何時","なんじ","几点","other"],["何分","なんぷん","几分","other"],["午前","ごぜん","上午","noun"],["午後","ごご","下午","noun"],["朝","あさ","早上","noun"],["昼","ひる","中午","noun"],["晩","ばん","晚上","noun"],["おととい","おととい","前天","other"],["きのう","きのう","昨天","other"],["きょう","きょう","今天","other"],["あした","あした","明天","other"],["あさって","あさって","后天","other"],["けさ","けさ","今天早上","other"],["こんばん","こんばん","今天晚上","other"],["休み","やすみ","休息","noun"],["昼休み","ひるやすみ","午休","noun"],["毎朝","まいあさ","每天早上","other"],["毎晩","まいばん","每天晚上","other"],["毎日","まいにち","每天","other"],["月曜日","げつようび","星期一","noun"],["火曜日","かようび","星期二","noun"],["水曜日","すいようび","星期三","noun"],["木曜日","もくようび","星期四","noun"],["金曜日","きんようび","星期五","noun"],["土曜日","どようび","星期六","noun"],["日曜日","にちようび","星期天","noun"],["何曜日","なんようび","星期几","other"],["～から","～から","从～","other"],["～まで","～まで","到～","other"],["～ごろ","～ごろ","～左右","other"]], g: [{ r:"今 ～時 ～分です", d:"【中式理解】表示现在的具体时间。", e:[["今 何時ですか。","现在几点？"]] },{ r:"动词ます / 动词ません / 动词ました", d:"【中式理解】动词的礼貌体。", e:[["わたしは 毎日 勉強します。","我每天学习。"]] },{ r:"名词（时间）に 动词", d:"【中式理解】在具体的时间点后面加「に」。", e:[["6時半に 起きます。","6点半起床。"]] }] };

    // ----------------- 第 5 课 全量数据 -----------------
    masterData["5"] = { v: [["行きます","いきます","去","verb"],["来ます","きます","来","verb"],["帰ります","かえります","回去","verb"],["学校","がっこう","学校","noun"],["スーパー","スーパー","超市","noun"],["駅","えき","车站","noun"],["飛行機","ひこうき","飞机","noun"],["船","ふね","船","noun"],["電車","でんしゃ","电车","noun"],["地下鉄","ちかてつ","地铁","noun"],["新幹線","しんかんせん","新干线","noun"],["バス","バス","公交车","noun"],["タクシー","タクシー","出租车","noun"],["自転車","じてんしゃ","自行车","noun"],["歩いて","あるいて","走路","other"],["人","ひと","人","noun"],["友達","ともだち","朋友","noun"],["彼","かれ","他","noun"],["彼女","かのじょ","她","noun"],["家族","かぞく","家族","noun"],["一人で","ひとりで","一个人","other"],["先週","せんしゅう","上周","other"],["今週","こんしゅう","这周","other"],["来週","らいしゅう","下周","other"],["先月","せんげつ","上个月","other"],["今月","こんげつ","这个月","other"],["来月","らいげつ","下个月","other"],["去年","きょねん","去年","other"],["今年","ことし","今年","other"],["来年","らいねん","明年","other"],["～年","～ねん","～年","other"],["何年","なんねん","几年","other"],["～月","～がつ","～月","other"],["何月","なんがつ","几月","other"],["～日","～にち","～日","other"],["何日","なんにち","几号","other"],["いつ","いつ","什么时候","other"],["誕生日","たんじょうび","生日","noun"]], g: [{ r:"名词（场所）へ 行きます / 来ます / 帰ります", d:"【中式理解】移动的方向用助词「へ」表示。", e:[["京都へ 行きます。","去京都。"]] },{ r:"どこ[へ]も 行きません", d:"【中式理解】对疑问词所问范围的全部加以否定。", e:[["どこ[へ]も 行きません。","哪儿也不去。"]] },{ r:"名词（交通工具）で 行きます", d:"【中式理解】助词「で」表示手段、方法。", e:[["電車で 行きます。","坐电车去。"]] },{ r:"名词（人/动物）と 动词", d:"【中式理解】一起行动的人用助词「と」表示。", e:[["家族と 日本へ 来ました。","和家里人一起来日本的。"]] }] };

    // ==========================================
    // 🌟 日文假名 -> 罗马音 自动转换引擎
    // ==========================================
    function kanaToRomaji(kanaStr) {
        if (!kanaStr) return "";

    masterData["23"] = { v: [["聞きます","ききます","问(老师)","verb"],["回します","まわします","转","verb"],["引きます","ひきます","拉、拽","verb"],["変えます","かえます","改变","verb"],["さわります","さわります","摸、碰","verb"],["出ます","でます","找(零钱)","verb"],["歩きます","あるきます","走","verb"],["渡ります","わたります","过(桥)","verb"],["曲がります","まがります","拐弯","verb"],["さびしい","さびしい","寂寞","adjective"],["お湯","おゆ","热水","noun"],["音","おと","声音","noun"],["サイズ","サイズ","号码、尺寸","noun"],["故障","こしょう","故障","noun"],["道","みち","道路","noun"],["交差点","こうさてん","十字路口","noun"],["信号","しんごう","红绿灯","noun"],["角","かど","拐角、路口","noun"],["橋","はし","桥","noun"],["駐車場","ちゅうしゃじょう","停车场","noun"],["建物","たてもの","建筑物","noun"],["何回も","なんかいも","多次、好几次","other"],["～目","～め","第～","other"]], g: [{ r:"～とき", d:"【中式理解】「とき」表示其后续主句所表示的状态、动作以及现象成立的时间。「とき」前面的形态与修饰名词时的形态相同。相当于“在……的时候”。", e:[["図書館で 本を 借りる とき、カードが 要ります。","在图书馆借书时，需要借书卡。"],["使い方が わからない とき、わたしに 聞いて ください。","不知道使用方法时，请来问我。"]] }, { r:"动词字典形と、～(主句)", d:"【中式理解】「と」表示一发生前面的动作，后面就必然发生。相当于“一……就……”。", e:[["この ボタンを 押すと、お釣りが 出ます。","一按这个按钮，找的零钱就会出来。"],["これを 回すと、音が 大きく なります。","一转这个，声音就会变大。"]] }, { r:"名词が 形容词", d:"【中式理解】把五官所感的某种现象直接说出来或客观地传达时，主语用「が」表示。", e:[["音が 小さいです。","声音很小。"]] }, { r:"名词を 移动动词", d:"【中式理解】可以和「さんぽします」「わたります」等移动动词一起使用的「を」表示人或物通过的场所。", e:[["公園を 散歩します。","在公园散步。"],["道を 渡ります。","过马路。"],["交差点を 右へ 曲がります。","在十字路口往右拐。"]] }] };

    // ----------------- 第 24 课 全量数据 -----------------
    masterData["24"] = { v: [["くれます","くれます","给(我、我方)","verb"],["直します","なおします","修理、修改","verb"],["連れて行きます","つれていきます","领着去","verb"],["連れて来ます","つれてきます","领着来","verb"],["送ります","おくります","送(人)","verb"],["紹介します","しょうかいします","介绍","verb"],["案内します","あんないします","导游、领路","verb"],["説明します","せつめいします","说明、讲解","verb"],["おじいさん","おじいさん","爷爷、姥爷","noun"],["おばあさん","おばあさん","奶奶、姥姥","noun"],["準備","じゅんび","准备","noun"],["引っ越し","ひっこし","搬家","noun"],["お菓子","おかし","点心","noun"],["ホームステイ","ホームステイ","寄宿家庭","noun"],["全部","ぜんぶ","全部","other"],["自分で","じぶんで","自己来","other"]], g: [{ r:"くれます", d:"【中式理解】不能用于说话人以外的人给说话人东西时，这时要用「くれます」。", e:[["わたしは 佐藤さんに 花を あげました。","我送佐藤花了。"],["佐藤さんは わたしに クリスマスカードを くれました。","佐藤送我圣诞卡了。"]] }, { r:"动词て形 あげます / もらいます / くれます", d:"【中式理解】「あげます」「もらいます」「くれます」用于表示物品的交换、互赠时。但用「～て あげます」「～て もらいます」「～て くれます」也可用于表示因某行为自己受惠或使对方受惠的场合。", e:[["わたしは 木村さんに 本を 貸して あげました。","我把书借给了木村。"],["わたしは 山田さんに 図書館の 電話番号を 教えて もらいました。","我向山田问了图书馆的电话号码。"],["母は [わたしに] セーターを 送って くれました。","妈妈给我寄来了毛衣。"]] }, { r:"名词1は 名词2が 动词", d:"【中式理解】在回答的句子中，「さとうさんが この ワインを くれました」的宾语「この ワインを」作为主题（参考第17课5）。", e:[["おいしい ワインですね。","真好喝的葡萄酒啊。"],["……ええ、[この ワインは] 佐藤さんが くれました。","……嗯，（这葡萄酒）是佐藤送我的。"]] }] };

    // ----------------- 第 25 课 全量数据 -----------------
    masterData["25"] = { v: [["考えます","かんがえます","考虑、想","verb"],["着きます","つきます","到(年纪)","verb"],["取ります","とります","上(年纪)","verb"],["足ります","たります","够","verb"],["田舎","いなか","乡下、老家","noun"],["チャンス","チャンス","机会","noun"],["億","おく","亿","noun"],["もし","もし","如果、要是","other"],["意味","いみ","意思","noun"],["転勤","てんきん","调动工作","noun"],["こと","こと","事情","noun"],["暇","ひま","空闲","adjective"],["いろいろお世話になりました","いろいろおせわになりました","承蒙您的多方关照","other"],["頑張ります","がんばります","加油、努力","verb"],["どうぞお元気で","どうぞおげんきで","请多保重","other"]], g: [{ r:"普通形过去ら、～(主句)", d:"【中式理解】动词、形容词、名词的普通形过去时接「ら」，表示假定条件，在其后接续的句子（主句）中，表示的是在那一假定条件下所成立的内容。主句可以使用表示说话人的意志、愿望、劝诱、委托、请求等表现。", e:[["お金が あったら、旅行します。","如果有钱的话，就去旅行。"],["時間が なかったら、テレビを 見ません。","如果没有时间的话，就不看电视。"]] }, { r:"动词た形ら、～(主句)", d:"【中式理解】在知道某一情况将会达成时，用「动词た形ら」这一句型来表示在前面的情况达成后，后面接续的主句的动作、事态的成立。", e:[["10時に なったら、出かけましょう。","到10点就出发吧。"],["うちへ 帰ったら、すぐ シャワーを 浴びます。","到家后马上冲个澡。"]] }, { r:"动词て形 / 动词ない形なくて / い形容词(～い) → ～くて / な形容词[な] → ～で / 名词で も、～(主句)", d:"【中式理解】表示逆接的假定条件。在「て形も」后续的主句中，所表示的是在此条件下，通常预期的事情没有发生，或发生的是与通常预期相反的事情。相当于“即使……也……”。", e:[["雨が 降っても、洗濯します。","即使下雨也要洗衣服。"],["安くても、わたしは グループ旅行が 嫌いです。","即使便宜，我也不愿意参加团体旅行。"],["便利でも、パソコンを 使いません。","即使方便也不用电脑。"]] }, { r:"もし", d:"【中式理解】「もし」和「～たら」一起使用，表示这个句子为条件句。「もし」强调说话人的假定语气。", e:[["もし 1億円 あったら、いろいろな 国を 旅行したいです。","如果有一亿日元的话，我想去很多国家旅行。"]] }, { r:"从属句中的主语", d:"【中式理解】在第16课2，就「～てから」句节中的主语用「が」表示进行了解说。与「～てから」「～とき」「～と」「～まえに」等一样，在「～たら」「～ても」中，从属句的主语也用「が」表示。", e:[["友達が 来る まえに、部屋を 掃除します。","在朋友来之前，要把房间打扫干净。"],["妻が 病気の とき、会社を 休みます。","妻子生病的时候，跟公司请假。"],["友達が 約束の 時間に 来なかったら、どうしますか。","要是朋友在约好的时间没来怎么办？"]] }] };
