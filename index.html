<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日语 N5–N3 互动学习工具 · 为中国学习者定制</title>
<style>
:root{
  --bg:#f6f6f4;
  --card:#ffffff;
  --ink:#1c1917;
  --ink2:#57534e;
  --ink3:#a8a29e;
  --line:#e7e5e4;
  --line2:#f0efee;
  --accent:#d94f3d;
  --accent-soft:#fdf1ef;
  --n5:#16a34a;
  --n4:#2563eb;
  --n3:#9333ea;
  --gold:#b8860b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);
  line-height:1.6;
  overflow:hidden;
}

/* ===== Header ===== */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.88);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.hd-top{
  display:flex;align-items:center;gap:14px;
  padding:11px 18px 9px;
}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-mark{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),#f0776a);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;letter-spacing:-.5px;
  box-shadow:0 2px 6px rgba(217,79,61,.28);
}
.brand-txt{font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--ink3);font-weight:400;letter-spacing:.3px}

.search-wrap{flex:1;position:relative;max-width:440px;margin-left:auto}
.search-wrap input{
  width:100%;padding:8px 12px 8px 34px;
  border:1px solid var(--line);border-radius:10px;
  font-size:13.5px;background:#fff;outline:none;
  transition:border-color .15s,box-shadow .15s;
  font-family:inherit;color:var(--ink);
}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-wrap input::placeholder{color:var(--ink3)}
.search-ico{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--ink3);font-size:13px;pointer-events:none;
}

/* Tabs row */
.hd-tabs{
  display:flex;align-items:center;gap:8px;
  padding:0 18px 9px;flex-wrap:wrap;
}
.seg{
  display:inline-flex;background:#efeeec;border-radius:9px;padding:2.5px;gap:2px;
}
.seg button{
  border:0;background:transparent;padding:5px 13px;border-radius:7px;
  font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;
  font-family:inherit;transition:all .15s;white-space:nowrap;
}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09)}
.seg button.on[data-mode="grammar"]{color:var(--accent)}

.lvbtn{
  border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink2);
  cursor:pointer;font-family:inherit;transition:all .14s;white-space:nowrap;
}
.lvbtn:hover{border-color:var(--ink3)}
.lvbtn.on{color:#fff;border-color:transparent}
.lvbtn.on[data-lv="N5"]{background:var(--n5)}
.lvbtn.on[data-lv="N4"]{background:var(--n4)}
.lvbtn.on[data-lv="N3"]{background:var(--n3)}
.lvbtn.on[data-lv="all"]{background:var(--ink)}

.spacer{flex:1}
.speed{
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink3);
  white-space:nowrap;
}
.speed input{width:78px;accent-color:var(--accent);cursor:pointer}
.stat{font-size:11.5px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ===== Main ===== */
main{display:flex;height:calc(100vh - 108px);overflow:hidden}

.list-pane{
  width:340px;flex-shrink:0;overflow-y:auto;overscroll-behavior:contain;
  border-right:1px solid var(--line);
  background:#fff;
  padding:8px 0 60px;
}
.list-pane::-webkit-scrollbar{width:9px}
.list-pane::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:5px;border:2px solid #fff}
.list-pane::-webkit-scrollbar-track{background:transparent}

.sec-h{
  font-size:10.5px;font-weight:700;letter-spacing:.9px;color:var(--ink3);
  padding:14px 18px 5px;text-transform:uppercase;
}

.item{
  display:flex;align-items:center;gap:10px;
  padding:9px 16px 9px 18px;cursor:pointer;
  border-left:2.5px solid transparent;
  transition:background .1s,border-color .1s;
  position:relative;
}
.item:hover{background:#fafaf9}
.item.on{background:var(--accent-soft);border-left-color:var(--accent)}
.item.on .i-jp{color:var(--accent)}

.i-body{flex:1;min-width:0}
.i-jp{
  font-size:15px;font-weight:600;letter-spacing:-.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:baseline;gap:7px;
}
.i-kana{
  font-size:11px;font-weight:400;color:var(--ink3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex-shrink:1;min-width:0;
}
.i-cn{
  font-size:11.5px;color:var(--ink2);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.i-lv{
  font-size:9.5px;font-weight:700;padding:1.5px 5px;border-radius:4px;
  flex-shrink:0;letter-spacing:.3px;color:#fff;
}
.i-lv[data-lv="N5"]{background:var(--n5)}
.i-lv[data-lv="N4"]{background:var(--n4)}
.i-lv[data-lv="N3"]{background:var(--n3)}

/* ===== Detail ===== */
.detail{
  flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:34px 44px 100px;
}
.detail::-webkit-scrollbar{width:10px}
.detail::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:5px;border:3px solid var(--bg)}

.empty{
  height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  color:var(--ink3);text-align:center;padding:20px;
}
.empty-ico{font-size:46px;opacity:.32;line-height:1}
.empty-t{font-size:14px;font-weight:600;color:var(--ink2)}
.empty-s{font-size:12.5px;max-width:330px;line-height:1.8}

.d-head{margin-bottom:22px}
.d-badges{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
.badge{
  font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;
  letter-spacing:.3px;
}
.badge.lv{color:#fff}
.badge.lv[data-lv="N5"]{background:var(--n5)}
.badge.lv[data-lv="N4"]{background:var(--n4)}
.badge.lv[data-lv="N3"]{background:var(--n3)}
.badge.pos{background:#f0efee;color:var(--ink2)}
.badge.pos.hl{background:var(--accent-soft);color:var(--accent)}

.d-jp{
  font-size:46px;font-weight:700;letter-spacing:-1.5px;line-height:1.15;
  margin-bottom:8px;word-break:break-word;
}
.d-kana{font-size:19px;color:var(--ink2);letter-spacing:.5px;margin-bottom:6px}
.d-cn{font-size:17px;color:var(--ink);font-weight:500;margin-bottom:18px}

.play-btn{
  display:inline-flex;align-items:center;gap:9px;
  background:var(--accent);color:#fff;border:0;
  padding:11px 24px;border-radius:11px;
  font-size:14.5px;font-weight:600;cursor:pointer;
  font-family:inherit;
  box-shadow:0 2px 10px rgba(217,79,61,.3);
  transition:transform .1s,box-shadow .15s;
  margin-bottom:28px;
}
.play-btn:hover{box-shadow:0 4px 16px rgba(217,79,61,.4)}
.play-btn:active{transform:scale(.97)}
.play-btn.playing{background:#b84435}
.play-btn svg{width:17px;height:17px;fill:currentColor}

.sec{margin-bottom:26px}
.sec-t{
  font-size:11px;font-weight:700;letter-spacing:1.1px;color:var(--ink3);
  text-transform:uppercase;margin-bottom:11px;
  display:flex;align-items:center;gap:8px;
}
.sec-t::after{content:'';flex:1;height:1px;background:var(--line)}

/* Conjugation grid */
.conj{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:8px;
}
.conj-c{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 13px;cursor:pointer;transition:all .13s;
}
.conj-c:hover{border-color:var(--accent);background:var(--accent-soft)}
.conj-c:active{transform:scale(.98)}
.conj-k{font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:.4px;margin-bottom:2px}
.conj-v{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:.2px}

/* Example */
.ex{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:15px 17px;cursor:pointer;transition:all .13s;
}
.ex:hover{border-color:var(--accent);background:var(--accent-soft)}
.ex-jp{font-size:17px;font-weight:600;margin-bottom:4px;letter-spacing:-.2px;line-height:1.5}
.ex-kana{font-size:12.5px;color:var(--ink3);margin-bottom:7px;letter-spacing:.3px}
.ex-cn{font-size:13.5px;color:var(--ink2);padding-top:7px;border-top:1px solid var(--line2)}

/* Grammar specific */
.g-struct{
  background:#fbfaf9;border:1px solid var(--line);border-radius:11px;
  padding:13px 16px;margin-bottom:12px;
}
.g-struct-k{font-size:10.5px;font-weight:700;color:var(--ink3);letter-spacing:.7px;margin-bottom:5px}
.g-struct-v{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:.2px}
.g-mean{font-size:19px;font-weight:600;color:var(--accent);margin-bottom:6px}
.g-note{font-size:14px;color:var(--ink2);line-height:1.85}

.notice{
  font-size:12.5px;color:var(--ink3);padding:11px 15px;
  background:#fbfaf9;border-radius:9px;border:1px solid var(--line2);
  line-height:1.7;
}

/* Mobile */
.mob-detail-btn{display:none}
@media(max-width:860px){
  .hd-top{flex-wrap:wrap;gap:9px;padding:10px 14px 8px}
  .brand-txt{font-size:14px}
  .brand-sub{display:none}
  .search-wrap{max-width:none;width:100%;margin-left:0;order:3}
  .hd-tabs{padding:0 14px 8px;gap:6px}
  .speed,.stat{display:none}
  main{height:calc(100vh - 132px)}
  .list-pane{width:100%;border-right:0}
  .detail{
    position:fixed;inset:0;top:auto;height:88vh;z-index:100;
    background:var(--bg);border-radius:18px 18px 0 0;
    box-shadow:0 -8px 40px rgba(0,0,0,.22);
    padding:24px 22px 90px;
    transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  }
  .detail.open{transform:translateY(0)}
  .mob-detail-btn{
    display:block;position:fixed;bottom:0;left:0;right:0;z-index:99;
    background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:11px 18px calc(11px + env(safe-area-inset-bottom));
    text-align:center;font-size:14px;font-weight:600;color:var(--accent);
    cursor:pointer;
  }
  .d-jp{font-size:36px}
  .conj{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}
  .mob-close{
    display:flex;width:38px;height:5px;border-radius:3px;background:#d6d3d1;
    margin:-12px auto 16px;cursor:pointer;
  }
}
@media(min-width:861px){.mob-close{display:none}}
</style>
</head>
<body>

<header>
  <div class="hd-top">
    <div class="brand">
      <div class="brand-mark">あ</div>
      <div>
        <div class="brand-txt">日语 N5–N3 学习工具</div>
        <div class="brand-sub">点击即发音 · 即时语法分析</div>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-ico">🔍</span>
      <input id="q" type="search" placeholder="搜索汉字 / 假名 / 中文…" autocomplete="off">
    </div>
  </div>
  <div class="hd-tabs">
    <div class="seg" id="modeSeg">
      <button data-mode="vocab" class="on">词汇</button>
      <button data-mode="grammar">语法</button>
    </div>
    <button class="lvbtn on" data-lv="all">全部</button>
    <button class="lvbtn" data-lv="N5">N5</button>
    <button class="lvbtn" data-lv="N4">N4</button>
    <button class="lvbtn" data-lv="N3">N3</button>
    <div class="spacer"></div>
    <div class="speed">
      <span>语速</span>
      <input id="rate" type="range" min="0.5" max="1.4" step="0.05" value="0.95">
    </div>
    <div class="stat" id="stat"></div>
  </div>
</header>

<main>
  <div class="list-pane" id="list"></div>
  <div class="detail" id="detail">
    <div style="display:flex; justify-content:center; padding:12px; cursor:pointer; font-size:15px; color:#d94f3d; font-weight:bold;" onclick="document.getElementById('detail').classList.remove('open')">⬇️ 点击返回列表 ⬇️</div>
    <div class="empty">
      <div class="empty-ico">📖</div>
      <div class="empty-t">从左侧选择一个词条</div>
      <div class="empty-s">点击任意词条即可听到日语发音，并查看词性、活用形、例句等详细分析。</div>
    </div>
  </div>
</main>

<div class="mob-detail-btn" id="mobBtn" style="display:none">查看详细分析 ▲</div>

<script>
/* ============================================================
   数据格式（紧凑数组，加载时转对象）
   词汇: [汉字, 假名, 中文, 词性, 子类, 等级, 例句日, 例句假名, 例句中]
   语法: [句型, 等级, 接续, 中文意思, 说明, 例日, 例假名, 例中]
   ============================================================ */

const RAW_VOCAB = [
/* ---------- N5 一类动词（五段） ---------- */
["書く","かく","写","动词","一类","N5","手紙を書きます","てがみをかきます","写信"],
["読む","よむ","读","动词","一类","N5","本を読みます","ほんをよみます","读书"],
["話す","はなす","说","动词","一类","N5","日本語を話します","にほんごをはなします","说日语"],
["聞く","きく","听、问","动词","一类","N5","音楽を聞きます","おんがくをききます","听音乐"],

["出す","だす","拿出、寄出","动词","一类","N5","手紙を出します","てがみをだします","寄信"],

/* ---------- N5 二类动词（一段） ---------- */
["食べる","たべる","吃","动词","二类","N5","朝ご飯を食べます","あさごはんをたべます","吃早饭"],
["見る","みる","看","动词","二类","N5","テレビを見ます","てれびをみます","看电视"],
["起きる","おきる","起床","动词","二类","N5","六時に起きます","ろくじにおきます","六点起床"],
["寝る","ねる","睡觉","动词","二类","N5","早く寝ます","はやくねます","早点睡"],
["出る","でる","出去、出来","动词","二类","N5","家を出ます","いえをでます","出家门"],
["教える","おしえる","教","动词","二类","N5","日本語を教えます","にほんごをおしえます","教日语"],
["覚える","おぼえる","记住","动词","二类","N5","単語を覚えます","たんごをおぼえます","记单词"],
["開ける","あける","打开","动词","二类","N5","窓を開けます","まどをあけます","开窗"],
["閉める","しめる","关闭","动词","二类","N5","ドアを閉めます","どあをしめます","关门"],
["着る","きる","穿","动词","二类","N5","服を着ます","ふくをきます","穿衣服"],
["借りる","かりる","借入","动词","二类","N5","本を借ります","ほんをかります","借书"],
["できる","できる","会、能","动词","二类","N5","日本語ができます","にほんごができます","会日语"],
["出かける","でかける","出门","动词","二类","N5","朝出かけます","あさでかけます","早上出门"],
["忘れる","わすれる","忘记","动词","二类","N5","名前を忘れます","なまえをわすれます","忘记名字"],
["考える","かんがえる","思考","动词","二类","N5","よく考えます","よくかんがえます","好好思考"],

/* ---------- N5 三类动词 ---------- */
["する","する","做","动词","三类","N5","宿題をします","しゅくだいをします","做作业"],
["来る","くる","来","动词","三类","N5","明日来ます","あしたきます","明天来"],
["勉強する","べんきょうする","学习","动词","三类","N5","毎日勉強します","まいにちべんきょうします","每天学习"],

  if(sub==='三类'){
    if(kana==='する') return {'ます形':'します','て形':'して','た形':'した','ない形':'しない','可能形':'できる','意志形':'しよう','条件形':'すれば'};
    if(kana==='くる'||kana==='来る') return {'ます形':'きます','て形':'きて','た形':'きた','ない形':'こない','可能形':'こられる','意志形':'こよう','条件形':'くれば'};
    if(kana.endsWith('する')){
      const stem = kana.slice(0,-2);
      return {'ます形':stem+'します','て形':stem+'して','た形':stem+'した','ない形':stem+'しない','可能形':stem+'できる','意志形':stem+'しよう','条件形':stem+'すれば'};
    }
  }
  // 二类动词
  if(sub==='二类'){
    const stem = kana.slice(0,-1);
    return {'ます形':stem+'ます','て形':stem+'て','た形':stem+'た','ない形':stem+'ない','可能形':stem+'られる','意志形':stem+'よう','条件形':stem+'れば'};
  }
  // 一类动词
  if(sub==='一类'){
    const last = kana.slice(-1);
    const stem = kana.slice(0,-1);
    const r = GODAN[last];
    if(!r) return null;
    // 行く 特殊て形
    if(kana==='いく'||kana==='行く'){
      return {'ます形':'いきます','て形':'いって','た形':'いった','ない形':'いかない','可能形':'いける','意志形':'いこう','条件形':'いけば'};
    }
    return {
      'ます形':stem+r.i+'ます',
      'て形':stem+r.te,
      'た形':stem+r.ta,
      'ない形':stem+r.a+'ない',
      '可能形':stem+r.e+'る',
      '意志形':stem+r.o+'う',
      '条件形':stem+r.e+'ば'
    };
  }
  return null;
}

function conjIAdj(kana){
  const stem = kana.slice(0,-1);
  if(kana==='いい'||kana==='良い') return {'否定形':'よくない','过去形':'よかった','过去否定':'よくなかった','て形':'よくて','副词形':'よく'};
  return {
    '否定形':stem+'くない',
    '过去形':stem+'かった',
    '过去否定':stem+'くなかった',
    'て形':stem+'くて',
    '副词形':stem+'く'
  };
}

function conjNaAdj(kana){
  return {
    '否定形':kana+'ではない',
    '过去形':kana+'だった',
    '过去否定':kana+'ではなかった',
    'て形':kana+'で',
    '副词形':kana+'に'
  };
}

/* ============================================================
   发音引擎
   ============================================================ */
let jaVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v=>/ja[-_]JP/i.test(v.lang)) || vs.find(v=>/^ja/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

let playingBtn = null;
function speak(text, btn){
  if(!('speechSynthesis' in window)){
    alert('您的浏览器不支持语音合成，请使用 Chrome / Edge / Safari。');
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = parseFloat(document.getElementById('rate').value) || 0.95;
  u.pitch = 1.0;
  u.volume = 1.0;
  if(jaVoice) u.voice = jaVoice;

  if(playingBtn) playingBtn.classList.remove('playing');
  if(btn){
    btn.classList.add('playing');
    playingBtn = btn;
  }
  u.onend = ()=>{ if(btn) btn.classList.remove('playing'); playingBtn = null; };
  u.onerror = ()=>{ if(btn) btn.classList.remove('playing'); playingBtn = null; };
  speechSynthesis.speak(u);
}

/* ============================================================
   状态
   ============================================================ */
let mode = 'vocab';
let level = 'all';
let keyword = '';
let currentKey = null;

/* ============================================================
   渲染列表
   ============================================================ */
const listEl = document.getElementById('list');
const detailEl = document.getElementById('detail');
const statEl = document.getElementById('stat');

function getData(){
  return mode==='vocab' ? VOCAB : GRAMMAR;
}

function filtered(){
  const kw = keyword.trim().toLowerCase();
  return getData().filter(d=>{
    if(level!=='all' && d.lv!==level) return false;
    if(kw && !d._s.includes(kw)) return false;
    return true;
  });
}

function renderList(){
  const data = filtered();
  if(!data.length){
    listEl.innerHTML = '<div class="empty" style="padding-top:60px"><div class="empty-ico">🔍</div><div class="empty-t">没有找到匹配的条目</div><div class="empty-s">试试换个关键词，或切换等级筛选。</div></div>';
    statEl.textContent = '0 条';
    return;
  }
  // 分组
  const groups = {};
  const order = [];
  data.forEach(d=>{
    if(!groups[d.lv]){ groups[d.lv]=[]; order.push(d.lv); }
    groups[d.lv].push(d);
  });
  order.sort((a,b)=>a.localeCompare(b));

  let html = '';
  order.forEach(lv=>{
    html += `<div class="sec-h">JLPT ${lv} · ${groups[lv].length} 条</div>`;
    groups[lv].forEach(d=>{
      const key = mode==='vocab' ? d.jp+'|'+d.kana : d.point;
      const isOn = key===currentKey;
      if(mode==='vocab'){
        html += `<div class="item${isOn?' on':''}" data-key="${esc(key)}">
          <div class="i-body">
            <div class="i-jp">${esc(d.jp)}<span class="i-kana">${esc(d.kana)}</span></div>
            <div class="i-cn">${esc(d.cn)}</div>
          </div>
          <span class="i-lv" data-lv="${d.lv}">${d.lv}</span>
        </div>`;
      }else{
        html += `<div class="item${isOn?' on':''}" data-key="${esc(key)}">
          <div class="i-body">
            <div class="i-jp">${esc(d.point)}</div>
            <div class="i-cn">${esc(d.mean)}</div>
          </div>
          <span class="i-lv" data-lv="${d.lv}">${d.lv}</span>
        </div>`;
      }
    });
  });
  listEl.innerHTML = html;
  statEl.textContent = data.length + ' 条';

  listEl.querySelectorAll('.item').forEach(el=>{
    el.addEventListener('click', ()=>selectItem(el.dataset.key));
  });
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   选择条目 → 渲染详情
   ============================================================ */
function selectItem(key){
  currentKey = key;
  // 更新列表高亮
  listEl.querySelectorAll('.item').forEach(el=>{
    el.classList.toggle('on', el.dataset.key===key);
  });

  if(mode==='vocab'){
    const d = VOCAB.find(v=>v.jp+'|'+v.kana===key);
    if(d) renderVocab(d);
  }else{
    const d = GRAMMAR.find(v=>v.point===key);
    if(d) renderGrammar(d);
  }
  if(window.innerWidth<=860){
    detailEl.classList.add('open');
    document.getElementById('mobBtn').style.display='block';
  }
}

/* ---------- 词汇详情 ---------- */
function renderVocab(d){
  const conj = d.pos==='动词' ? conjugate(d.kana, d.sub) : null;
  const isI = d.pos==='い形容词';
  const isNa = d.pos==='な形容词';

  let conjHtml = '';
  let conjLabel = '';
  let conjData = null;

  if(d.pos==='动词' && conj){ conjData = conj; conjLabel = '动词活用形'; }
  else if(isI){ conjData = conjIAdj(d.kana); conjLabel = '形容词活用形'; }
  else if(isNa){ conjData = conjNaAdj(d.kana); conjLabel = '形容词活用形'; }

  if(conjData){
    conjHtml = `<div class="sec">
      <div class="sec-t">${conjLabel}　点击可发音</div>
      <div class="conj">${
        Object.entries(conjData).map(([k,v])=>
          `<div class="conj-c" data-speak="${esc(v)}">
            <div class="conj-k">${k}</div>
            <div class="conj-v">${esc(v)}</div>
          </div>`).join('')
      }</div>
    </div>`;
  }

  const posLabel = d.pos==='动词' && d.sub ? `${d.pos} · ${d.sub}` : d.pos;

  detailEl.innerHTML = `
    <div class="d-head">
      <div class="d-badges">
        <span class="badge lv" data-lv="${d.lv}">${d.lv}</span>
        <span class="badge pos hl">${esc(posLabel)}</span>
      </div>
      <div class="d-jp">${esc(d.jp)}</div>
      <div class="d-kana">${esc(d.kana)}</div>
      <div class="d-cn">${esc(d.cn)}</div>
    </div>

    <button class="play-btn" id="playMain">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      播放「${esc(d.kana)}」
    </button>

    ${conjHtml}

    <div class="sec">
      <div class="sec-t">例句　点击可发音</div>
      <div class="ex" data-speak="${esc(d.exKana)}">
        <div class="ex-jp">${esc(d.exJp)}</div>
        <div class="ex-kana">${esc(d.exKana)}</div>
        <div class="ex-cn">${esc(d.exCn)}</div>
      </div>
    </div>

    <div class="notice">
      💡 点击上方任意卡片即可听到日语发音。发音使用浏览器内置的日语语音合成，无需联网。
    </div>
  `;

  bindDetailEvents();
  document.getElementById('playMain').addEventListener('click', function(){
    speak(d.kana, this);
  });
}

/* ---------- 语法详情 ---------- */
function renderGrammar(d){
  detailEl.innerHTML = `
    <div class="d-head">
      <div class="d-badges">
        <span class="badge lv" data-lv="${d.lv}">${d.lv}</span>
        <span class="badge pos">语法点</span>
      </div>
      <div class="d-jp" style="font-size:38px">${esc(d.point)}</div>
      <div class="g-mean">${esc(d.mean)}</div>
    </div>

    <div class="sec">
      <div class="sec-t">接续方式</div>
      <div class="g-struct">
        <div class="g-struct-k">STRUCTURE</div>
        <div class="g-struct-v">${esc(d.struct)}</div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-t">用法说明</div>
      <div class="g-note">${esc(d.note)}</div>
    </div>

    <div class="sec">
      <div class="sec-t">例句　点击可发音</div>
      <div class="ex" data-speak="${esc(d.exKana)}">
        <div class="ex-jp">${esc(d.exJp)}</div>
        <div class="ex-kana">${esc(d.exKana)}</div>
        <div class="ex-cn">${esc(d.exCn)}</div>
      </div>
    </div>

    <div class="notice">
      💡 语法点的例句同样可以点击发音。建议跟读三遍，加深记忆。
    </div>
  `;
  bindDetailEvents();
}

/* 绑定详情内的发音事件 */
function bindDetailEvents(){
  detailEl.querySelectorAll('[data-speak]').forEach(el=>{
    el.addEventListener('click', function(){
      speak(this.dataset.speak, this.classList.contains('play-btn')?this:null);
      if(!this.classList.contains('play-btn')){
        // 卡片类：临时闪烁
        this.style.transition='background .1s';
        const old = this.style.background;
        this.style.background='#fdf1ef';
        setTimeout(()=>{ this.style.background=old; }, 180);
      }
    });
  });
}

/* ============================================================
   事件绑定
   ============================================================ */
document.getElementById('modeSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  mode = btn.dataset.mode;
  currentKey = null;
  renderList();
  detailEl.innerHTML = `<div class="empty">
    <div class="empty-ico">${mode==='vocab'?'📖':'📐'}</div>
    <div class="empty-t">从左侧选择一个${mode==='vocab'?'词条':'语法点'}</div>
    <div class="empty-s">点击任意条目即可听到日语发音，并查看详细分析。</div>
  </div>`;
});

document.querySelectorAll('.lvbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.lvbtn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    level = btn.dataset.lv;
    renderList();
  });
});

let qTimer = null;
document.getElementById('q').addEventListener('input', e=>{
  clearTimeout(qTimer);
  qTimer = setTimeout(()=>{
    keyword = e.target.value;
    renderList();
  }, 120);
});

document.getElementById('mobBtn').addEventListener('click', ()=>{
  detailEl.classList.toggle('open');
});

// 移动端下拉关闭
detailEl.addEventListener('click', e=>{
  if(e.target.classList.contains('mob-close')){
    detailEl.classList.remove('open');
  }
});

/* ============================================================
   启动
   ============================================================ */
renderList();
</script>
  <button id="floatBack" style="display:none; position:fixed; top:20px; left:20px; z-index:9999; padding:8px 16px; background:#d94f3d; color:#fff; border:none; border-radius:20px; font-weight:bold; font-size:14px; box-shadow:0 2px 8px rgba(0,0,0,0.2);" onclick="document.getElementById('detail').classList.remove('open'); this.style.display='none';">⬅️ 返回列表</button>
<script>
  const dEl = document.getElementById('detail');
  const bBtn = document.getElementById('floatBack');
  new MutationObserver(() => {
    bBtn.style.display = dEl.classList.contains('open') ? 'block' : 'none';
  }).observe(dEl, { attributes: true });
</script>
