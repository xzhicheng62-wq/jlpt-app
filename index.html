<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>大家的日语 · 完美版</title>
    <style>
        :root { --bg-color: #f2f2f7; --card-bg: #ffffff; --text-main: #1c1c1e; --text-sub: #8e8e93; --accent-color: #007aff; --accent-light: #e5f0ff; --warning-color: #ff9500; --border-color: #e5e5ea; --success-color: #34c759; --danger-color: #ff3b30; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; padding-bottom: 80px; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 420px; margin-bottom: 12px; }
        .top-bar h1 { font-size: 1.1rem; font-weight: 700; }
        .top-bar .stats { font-size: 0.8rem; color: var(--text-sub); background: var(--border-color); padding: 4px 10px; border-radius: 12px; }
        .scroll-x { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; width: 100%; max-width: 420px; scrollbar-width: none; }
        .scroll-x::-webkit-scrollbar { display: none; }
        .btn-pill { flex: 0 0 auto; padding: 8px 16px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; font-size: 0.9rem; font-weight: 500; color: var(--text-sub); transition: all 0.2s; }
        .btn-pill.active { background: var(--accent-color); color: white; border-color: var(--accent-color); box-shadow: 0 4px 10px rgba(0,122,255,0.3); }
        
        .main-content { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
        .word-card { background: var(--card-bg); border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; position: relative; transition: all 0.3s ease; cursor: pointer; }
        .word-card:active { transform: scale(0.99); }
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; padding-right: 50px; }
        .word-jp { font-size: 1.4rem; font-weight: 700; }
        .word-kana { font-size: 1rem; color: var(--text-sub); margin-top: 4px; }
        .word-romaji { font-size: 0.85rem; color: #a0a0a5; margin-top: 2px; }
        .word-cn { font-size: 1rem; color: var(--accent-color); font-weight: 600; margin-top: 6px; }
        .word-type { font-size: 0.75rem; background: var(--warning-color); color: white; padding: 2px 8px; border-radius: 10px; position: absolute; top: 16px; left: 16px; }
        .speaker-btn { position: absolute; right: 16px; top: 16px; background: var(--accent-light); border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--accent-color); transition: all 0.2s; }
        .speaker-btn:active { transform: scale(0.9); background: #d0e4ff; }
        .word-details { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; margin-top: 0; background: #f8f9fa; border-radius: 12px; }
        .word-card.expanded .word-details { max-height: 1200px; margin-top: 16px; padding: 16px; border-top: 1px solid var(--border-color); }
        .conjugation-list { display: flex; flex-direction: column; gap: 8px; }
        .conjugation-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #e5e5ea; padding-bottom: 6px; }
        .conjugation-item:last-child { border-bottom: none; padding-bottom: 0; }
        .conjugation-label { font-size: 0.85rem; color: var(--text-sub); }
        .conjugation-value { font-size: 1rem; font-weight: 700; }
        
        .grammar-item { background: var(--card-bg); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .grammar-header { padding: 18px; font-weight: 600; font-size: 1.05rem; display: flex; justify-content: space-between; align-items: center; }
        .grammar-header::after { content: '▾'; color: var(--text-sub); transition: transform 0.3s; }
        .grammar-item.open .grammar-header::after { transform: rotate(180deg); }
        .grammar-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; padding: 0 18px; background: #fafafa; }
        .grammar-item.open .grammar-body { max-height: 2500px; padding: 18px; border-top: 1px solid var(--border-color); }
        .grammar-desc { font-size: 0.95rem; margin-bottom: 16px; line-height: 1.6; background: #e5f0ff; padding: 12px; border-radius: 8px; }
        .example { background: #fff; padding: 14px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid var(--accent-color); }
        .example .jp { font-size: 1rem; font-weight: 600; margin-bottom: 2px; }
        .example .romaji { font-size: 0.85rem; color: #a0a0a5; margin-bottom: 6px; }
        .example .cn { font-size: 0.9rem; color: var(--text-sub); }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(15px); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom, 20px); z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 0; color: var(--text-sub); font-size: 0.75rem; font-weight: 600; background: none; border: none; }
        .nav-item .icon { font-size: 1.5rem; margin-bottom: 4px; }
        .nav-item.active { color: var(--accent-color); }
        
        .quiz-question { background: var(--card-bg); border-radius: 20px; padding: 36px 20px; text-align: center; margin-bottom: 24px; }
        .quiz-question .q-text { font-size: 2.2rem; font-weight: 700; margin-bottom: 10px; }
        .quiz-question .q-sub { font-size: 1.1rem; color: var(--text-sub); }
        .quiz-question .q-romaji { font-size: 0.9rem; color: #a0a0a5; margin-top: 4px; }
        .quiz-options { display: flex; flex-direction: column; gap: 14px; }
        .option-btn { background: var(--card-bg); border: 2px solid var(--card-bg); border-radius: 16px; padding: 18px; font-size: 1.05rem; font-weight: 600; text-align: left; color: var(--text-main); }
        .option-btn.correct { background: #e5f9e5; border-color: var(--success-color); color: var(--success-color); }
        .option-btn.wrong { background: #ffe5e5; border-color: var(--danger-color); color: var(--danger-color); }
        .quiz-result { text-align: center; padding: 40px 0; }
        .quiz-result h2 { font-size: 1.6rem; margin-bottom: 16px; }
        .btn-primary { background: var(--accent-color); color: #fff; border: none; padding: 16px 32px; border-radius: 30px; font-size: 1.05rem; font-weight: 600; width: 100%; }
    </style>
</head>
<body>
    <div class="top-bar"><h1 id="pageTitle">📖 大家的日语</h1><div class="stats" id="statsInfo">1 / 25</div></div>
    <div class="scroll-x" id="lessonSelector"></div>
    <div class="scroll-x" id="filterBar">
        <button class="btn-pill active" data-type="all">全部</button>
        <button class="btn-pill" data-type="noun">名词</button>
        <button class="btn-pill" data-type="verb">动词</button>
        <button class="btn-pill" data-type="adjective">形容词</button>
        <button class="btn-pill" data-type="other">其他</button>
    </div>
    <div class="main-content" id="mainView">
        <div id="wordList" style="display: flex; flex-direction: column; gap: 12px;"></div>
        <div id="grammarList" style="display: none; flex-direction: column; gap: 12px;"></div>
        <div id="quizContainer" style="display: none;"></div>
    </div>
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('vocab')"><span class="icon">📝</span>单词</button>
        <button class="nav-item" onclick="switchTab('grammar')"><span class="icon">📚</span>语法</button>
        <button class="nav-item" onclick="switchTab('quiz')"><span class="icon">🎯</span>测试</button>
    </div>

<script>
    // ==========================================
    // 数据区：只包含第1-2课 (确保基础完全无错)
    // ==========================================
    const masterData = {
        "1": {
            v: [
                ["わたし","わたし","我","noun"], ["あなた","あなた","你","noun"], ["あの ひと","あの ひと","那个人","noun"],
                ["先生","せんせい","老师","noun"], ["学生","がくせい","学生","noun"], ["会社員","かいしゃいん","公司职员","noun"],
                ["銀行員","ぎんこういん","银行职员","noun"], ["医者","いしゃ","医生","noun"], ["研究者","けんきゅうしゃ","研究人员","noun"],
                ["大学","だいがく","大学","noun"], ["病院","びょういん","医院","noun"], ["だれ","だれ","谁","other"],
                ["どなた","どなた","哪位(礼貌)","other"], ["～歳","～さい","～岁","other"], ["何歳","なんさい","几岁","other"],
                ["はい","はい","是","other"], ["いいえ","いいえ","不是","other"], ["アメリカ","アメリカ","美国","noun"],
                ["イギリス","イギリス","英国","noun"], ["インド","インド","印度","noun"], ["インドネシア","インドネシア","印度尼西亚","noun"],
                ["韓国","かんこく","韩国","noun"], ["タイ","タイ","泰国","noun"], ["中国","ちゅうごく","中国","noun"],
                ["ドイツ","ドイツ","德国","noun"], ["日本","にほん","日本","noun"], ["ブラジル","ブラジル","巴西","noun"],
                ["～さん","～さん","先生/女士","other"], ["～ちゃん","～ちゃん","小~","other"], ["～じん","～じん","~人","other"]
            ],
            g: [
                { r:"名词1 は 名词2 です", d:"【中式理解】表示判断，相当于“A是B”。助词「は」在这里读作「wa」，不读「ha」。", e:[["わたしは マイク・ミラーです。","我是迈克·米勒。"],["わたしは 会社員です。","我是公司职员。"]] },
                { r:"名词1 は 名词2 じゃ（では） ありません", d:"【中式理解】「です」的否定形式。口语常缩略成「じゃ」，正式场合用「では」。", e:[["サントスさんは 学生じゃ ありません。","桑托斯不是学生。"]] },
                { r:"名词1 は 名词2 ですか", d:"【中式理解】句尾加「か」变成疑问句（升调）。肯定回答「はい」，否定回答「いいえ」。", e:[["ミラーさんは アメリカ人ですか。","米勒是美国人吗？"],["……はい、アメリカ人です。","……对，是美国人。"]] },
                { r:"名词も", d:"【中式理解】「も」相当于中文的“也”。把相同事物作为前提陈述时用。", e:[["ミラーさんは 会社員です。","米勒是公司职员。"],["グプタさんも 会社員です。","古普塔也是公司职员。"]] },
                { r:"名词1 の 名词2", d:"【中式理解】相当于中文的“的”。前面的名词1修饰后面的名词2。", e:[["ミラーさんは IMCの 社員です。","米勒是IMC公司的职员。"]] },
                { r:"～さん", d:"【中式理解】加在听话人或第三者姓名后，表敬意（类似中文的“先生/女士”）。但绝不能加在自己名字后。", e:[["あの 方は ミラーさんです。","那位是米勒先生。"]] }
            ]
        },
        "2": {
            v: [
                ["これ","これ","这(近)","other"], ["それ","それ","那(近)","other"], ["あれ","あれ","那(远)","other"],
                ["この","この","这个(后接名词)","other"], ["その","その","那个(后接名词)","other"], ["あの","あの","那个(后接名词)","other"],
                ["本","ほん","书","noun"], ["辞書","じしょ","字典","noun"], ["雑誌","ざっし","杂志","noun"],
                ["新聞","しんぶん","报纸","noun"], ["ノート","ノート","笔记本","noun"], ["手帳","てちょう","记事本","noun"],
                ["名刺","めいし","名片","noun"], ["カード","カード","卡片","noun"], ["鉛筆","えんぴつ","铅笔","noun"],
                ["ボールペン","ボールペン","圆珠笔","noun"], ["シャープペンシル","シャープペンシル","自动铅笔","noun"], ["鍵","かぎ","钥匙","noun"],
                ["時計","とけい","钟表","noun"], ["傘","かさ","伞","noun"], ["かばん","かばん","包、提包","noun"],
                ["CD","シーディー","CD、光盘","noun"], ["テレビ","テレビ","电视","noun"], ["ラジオ","ラジオ","收音机","noun"],
                ["カメラ","カメラ","照相机","noun"], ["コンピューター","コンピューター","电脑","noun"], ["車","くるま","汽车","noun"],
                ["机","つくえ","桌子","noun"], ["椅子","いす","椅子","noun"], ["チョコレート","チョコレート","巧克力","noun"],
                ["コーヒー","コーヒー","咖啡","noun"], ["英語","えいご","英语","noun"], ["日本語","にほんご","日语","noun"],
                ["～語","～ご","～语","other"], ["何","なん","什么","other"], ["そう","そう","是","other"]
            ],
            g: [
                { r:"これ / それ / あれ", d:"【中式理解】指示代词。近处（这）、中距离（那）、远处（那）。独自成句，后面不接名词。", e:[["それは 辞書ですか。","那是字典吗？"],["これは 誰の 傘ですか。","这是谁的伞？"]] },
                { r:"この / その / あの + 名词", d:"【中式理解】当你要说“这个书”、“那个人”时，必须加上名词，所以用この/その/あの。", e:[["この 本は わたしのです。","这本书是我的。"],["あの 方は どなたですか。","那位是谁？"]] },
                { r:"名词1 の 名词2", d:"【中式理解】表示所属或属性，相当于中文的“的”。", e:[["これは コンピューターの 本です。","这是计算机的书。"],["これは わたしの 本です。","这是我的书。"]] },
                { r:"そうですか", d:"【中式理解】听到新信息时，表示“噢，是这样啊”，降调读。", e:[["この 傘は あなたのですか。","这把伞是你的吗？"],["……いいえ、違います。シュミットさんのです。","……不是，那是舒米特的。"],["そうですか。","噢，是吗。"]] }
            ]
        }
    };

    // ==========================================
    // 🌟 日文假名 -> 罗马音 自动转换引擎
    // ==========================================
    function kanaToRomaji(kanaStr) {
        if (!kanaStr) return "";
        const map = {
            'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'wo','ん':'n','が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo','ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho','ちゃ':'cha','ちゅ':'chu','ちょ':'cho','にゃ':'nya','にゅ':'nyu','にょ':'nyo','ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo','みゃ':'mya','みゅ':'myu','みょ':'myo','りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo','じゃ':'ja','じゅ':'ju','じょ':'jo','びゃ':'bya','びゅ':'byu','びょ':'byo','ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo','ー':''
        };
        let result = ""; let i = 0;
        while (i < kanaStr.length) {
            if (kanaStr[i] === 'っ' || kanaStr[i] === 'ッ') { i++; if (i < kanaStr.length) { let nextChar = kanaStr[i], nextRomaji = ""; if (map[nextChar]) { nextRomaji = map[nextChar]; } else if (i + 1 < kanaStr.length && map[nextChar + kanaStr[i+1]]) { nextRomaji = map[nextChar + kanaStr[i+1]]; i++; } if (nextRomaji) { result += nextRomaji[0]; } } continue; }
            if (i + 1 < kanaStr.length && map[kanaStr[i] + kanaStr[i+1]]) { result += map[kanaStr[i] + kanaStr[i+1]]; i += 2; continue; }
            if (map[kanaStr[i]]) { result += map[kanaStr[i]]; } else { result += kanaStr[i]; }
            i++;
        }
        return result;
    }

    const $ = id => document.getElementById(id);
    const lessonSelector = $('lessonSelector'), filterBar = $('filterBar'), wordList = $('wordList'), grammarList = $('grammarList'), quizContainer = $('quizContainer'), statsInfo = $('statsInfo'), pageTitle = $('pageTitle');
    let currentLesson = "1", currentTab = "vocab", currentFilter = "all", quizState = { active: false, questions: [], currentIndex: 0, score: 0, answered: false }, speechSynth = window.speechSynthesis;

    document.addEventListener('DOMContentLoaded', () => { renderLessonButtons(); renderContent(); });

    function renderLessonButtons() {
        lessonSelector.innerHTML = '';
        for (let i = 1; i <= 25; i++) {
            const btn = document.createElement('button');
            btn.className = `btn-pill ${i == currentLesson ? 'active' : ''}`;
            btn.textContent = `第${i}课`;
            btn.onclick = () => { currentLesson = i.toString(); renderLessonButtons(); renderContent(); };
            lessonSelector.appendChild(btn);
        }
    }

    document.querySelectorAll('#filterBar .btn-pill').forEach(btn => {
        btn.onclick = (e) => {
            document.querySelectorAll('#filterBar .btn-pill').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentFilter = e.target.dataset.type;
            renderContent();
        };
    });

    function renderContent() {
        const data = masterData[currentLesson]; if (!data) return;
        statsInfo.textContent = `${currentLesson} / 25`; pageTitle.textContent = `📖 第${currentLesson}课`;
        wordList.style.display = currentTab === 'vocab' ? 'flex' : 'none';
        grammarList.style.display = currentTab === 'grammar' ? 'flex' : 'none';
        quizContainer.style.display = currentTab === 'quiz' ? 'flex' : 'none';
        if (currentTab === 'vocab') renderVocab(data.v);
        else if (currentTab === 'grammar') renderGrammar(data.g);
        else startQuiz(data.v);
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.nav-item[onclick="switchTab('${tab}')"]`).classList.add('active');
        renderContent();
    }

    function renderVocab(vocabList) {
        let filtered = vocabList;
        if (currentFilter !== 'all') filtered = vocabList.filter(item => item[3] === currentFilter);
        wordList.innerHTML = '';
        if (filtered.length === 0) { wordList.innerHTML = '<div style="text-align:center; padding:40px; color:#8e8e93;">该分类下暂无单词</div>'; return; }
        filtered.forEach(item => {
            const jp = item[0], kana = item[1], cn = item[2], type = item[3];
            let typeName = type === "noun" ? "名词" : type === "verb" ? "动词" : type === "adjective" ? "形容词" : "其他";
            let backContent = type === "verb" ? getConjugationHTML(kana, jp) : `<div class="conjugation-item"><div class="conjugation-label">释义</div><div class="conjugation-value">${cn}</div></div>`;
            const romaji = kanaToRomaji(kana);
            const card = document.createElement('div');
            card.className = 'word-card';
            card.innerHTML = `
                <div class="word-header"><div><div class="word-jp">${jp}</div><div class="word-kana">${kana}</div><div class="word-romaji">${romaji}</div><div class="word-cn">${cn}</div></div></div>
                <div class="word-type">${typeName}</div>
                <button class="speaker-btn" onclick="event.stopPropagation(); speakJapanese('${kana || jp}')">🔊</button>
                <div class="word-details"><div class="conjugation-list">${backContent}</div></div>
            `;
            card.onclick = () => card.classList.toggle('expanded');
            wordList.appendChild(card);
        });
    }

    function getConjugationHTML(kana, kanji) {
        let stem = kana.slice(0, -1), lastChar = kana.slice(-1), type = 1;
        if (kana.endsWith("する") || kana === "くる" || kana === "来る") type = 3;
        else if (lastChar === "る" && ["い","き","し","ち","に","ひ","み","り","え","け","せ","て","ね","へ","め","れ"].includes(kana.slice(-2,-1))) type = 2;
        let masu = "", te = "", ta = "", nai = "", potential = "", volitional = "", rule = "";
        if (type === 3) {
            if (kana.endsWith("する")) { let s = kana.slice(0, -2); masu = s+"します"; te = s+"して"; ta = s+"した"; nai = s+"しない"; potential = s+"できる"; volitional = s+"しよう"; rule = "不规则(する)：词尾「する」变为「し」「して」等。"; }
            else { masu = "来ます"; te = "来て"; ta = "来た"; nai = "来ない"; potential = "来られる"; volitional = "来よう"; rule = "不规则(来る)：特殊变形。"; }
        } else if (type === 1) {
            rule = "五段动词：根据词尾（う、く、ぐ、す、つ、ぬ、ぶ、む、る）分别变化。";
            const iDan = { 'う':'い', 'く':'き', 'ぐ':'ぎ', 'す':'し', 'つ':'ち', 'ぬ':'に', 'ぶ':'び', 'む':'み', 'る':'り' }; masu = stem+iDan[lastChar]+"ます";
            const teMap = { 'う':'って', 'つ':'って', 'る':'って', 'む':'んで', 'ぶ':'んで', 'ぬ':'んで', 'く':'いて', 'ぐ':'いで', 'す':'して' }; te = stem+teMap[lastChar];
            const taMap = { 'う':'った', 'つ':'った', 'る':'った', 'む':'んだ', 'ぶ':'んだ', 'ぬ':'んだ', 'く':'いた', 'ぐ':'いだ', 'す':'した' }; ta = stem+taMap[lastChar];
            const aDan = { 'う':'わ', 'く':'か', 'ぐ':'が', 'す':'さ', 'つ':'た', 'ぬ':'な', 'ぶ':'ば', 'む':'ま', 'る':'ら' }; nai = stem+aDan[lastChar]+"ない";
            const eDan = { 'う':'え', 'く':'け', 'ぐ':'げ', 'す':'せ', 'つ':'て', 'ぬ':'ね', 'ぶ':'べ', 'む':'め', 'る':'れ' }; potential = stem+eDan[lastChar]+"る";
            const oDan = { 'う':'お', 'く':'こ', 'ぐ':'ご', 'す':'そ', 'つ':'と', 'ぬ':'の', 'ぶ':'ぼ', 'む':'も', 'る':'ろ' }; volitional = stem+oDan[lastChar]+"う";
        } else {
            rule = "一段动词：去掉词尾「る」，加上「ます」「て」「た」「ない」等。";
            masu = stem+"ます"; te = stem+"て"; ta = stem+"た"; nai = stem+"ない"; potential = stem+"られる"; volitional = stem+"よう";
        }
        return `<div class="conjugation-item"><div class="conjugation-label">辞书形(基本形)</div><div class="conjugation-value">${kanji}</div></div><div class="conjugation-item"><div class="conjugation-label">ます形(礼貌体)</div><div class="conjugation-value">${masu}</div></div><div class="conjugation-item"><div class="conjugation-label">て形(连接形)</div><div class="conjugation-value">${te}</div></div><div class="conjugation-item"><div class="conjugation-label">た形(过去式)</div><div class="conjugation-value">${ta}</div></div><div class="conjugation-item"><div class="conjugation-label">ない形(否定形)</div><div class="conjugation-value">${nai}</div></div><div class="conjugation-item"><div class="conjugation-label">可能形(能动形)</div><div class="conjugation-value">${potential}</div></div><div class="conjugation-item"><div class="conjugation-label">意向形(意志形)</div><div class="conjugation-value">${volitional}</div></div><div class="conjugation-item" style="border-left-color: #ff9500;"><div class="conjugation-label">变形规则</div><div class="conjugation-value" style="font-size:0.9rem; color:#8e8e93;">${rule}</div></div>`;
    }

    function renderGrammar(grammarData) {
        grammarList.innerHTML = '';
        grammarData.forEach((g, index) => {
            const div = document.createElement('div'); div.className = `grammar-item ${index === 0 ? 'open' : ''}`;
            let examplesHTML = ''; if (g.e) g.e.forEach(e => { const exRomaji = kanaToRomaji(e[0]); examplesHTML += `<div class="example"><div class="jp">${e[0]}</div><div class="romaji">${exRomaji}</div><div class="cn">${e[1]}</div></div>`; });
            div.innerHTML = `<div class="grammar-header" onclick="this.parentElement.classList.toggle('open')">${g.r}</div><div class="grammar-body"><div class="grammar-desc">${g.d}</div>${examplesHTML}</div>`;
            grammarList.appendChild(div);
        });
    }

    function startQuiz(vocabList) {
        if (!vocabList || vocabList.length < 4) { quizContainer.innerHTML = '<div style="text-align:center; padding:40px; color:#8e8e93;">当前课程单词少于4个，无法生成测试题。</div>'; return; }
        const shuffled = [...vocabList].sort(() => 0.5 - Math.random()), selected = shuffled.slice(0, 4);
        quizState = { active: true, questions: [], currentIndex: 0, score: 0, answered: false };
        selected.forEach((c) => { const w = selected.filter(x => x[0] !== c[0]).slice(0, 3); const o = [...w, c].sort(() => 0.5 - Math.random()); quizState.questions.push({ question: c[0], kana: c[1], correctAnswer: c[2], options: o.map(x => x[2]) }); });
        renderQuizQuestion();
    }

    function renderQuizQuestion() {
        if (quizState.currentIndex >= quizState.questions.length) { renderQuizResult(); return; }
        const q = quizState.questions[quizState.currentIndex];
        const qRomaji = kanaToRomaji(q.kana);
        quizContainer.innerHTML = `<div style="font-size:0.9rem; color:#8e8e93; text-align:center; margin-bottom:12px;">第 ${quizState.currentIndex + 1} / ${quizState.questions.length} 题</div><div class="quiz-question"><div class="q-text">${q.question}</div><div class="q-sub">${q.kana}</div><div class="q-romaji">${qRomaji}</div><button class="speaker-btn" style="position:static; margin:16px auto 0; width:50px; height:50px; font-size:1.4rem;" onclick="speakJapanese('${q.kana}')">🔊</button></div><div class="quiz-options">${q.options.map(opt => `<button class="option-btn" onclick="checkAnswer(this, '${opt}', '${q.correctAnswer}')">${opt}</button>`).join('')}</div>`;
    }

    function checkAnswer(btn, selected, correct) {
        if (quizState.answered) return; quizState.answered = true;
        const options = quizContainer.querySelectorAll('.option-btn');
        options.forEach(opt => { opt.style.pointerEvents = 'none'; if (opt.textContent === correct) opt.classList.add('correct'); else if (opt.textContent === selected) opt.classList.add('wrong'); });
        if (selected === correct) { quizState.score++; speakJapanese('正解'); } else { speakJapanese('残念'); }
        setTimeout(() => { quizState.currentIndex++; quizState.answered = false; renderQuizQuestion(); }, 1500);
    }

    function renderQuizResult() {
        const t = quizState.questions.length, s = quizState.score, p = Math.round((s / t) * 100);
        let m = p === 100 ? "完美！🎉" : p >= 80 ? "很棒！👍" : p >= 60 ? "不错，继续加油！💪" : "要多多复习哦！📚";
        quizContainer.innerHTML = `<div class="quiz-result"><h2>${m}</h2><p>你答对了 ${s} / ${t} 题 (${p}%)</p><button class="btn-primary" onclick="switchTab('vocab')">返回学习</button></div>`;
    }

    function speakJapanese(text) {
        if (!text) return; if (speechSynth.speaking) speechSynth.cancel();
        const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = 0.85;
        const v = speechSynth.getVoices(); const j = v.find(x => x.lang.includes('ja-JP') || x.lang.includes('ja')); if (j) u.voice = j;
        speechSynth.speak(u);
    }

    document.body.addEventListener('touchstart', function initVoice() { if (speechSynth.getVoices().length === 0) speechSynth.getVoices(); document.body.removeEventListener('touchstart', initVoice); }, { once: true });
</script>
</body>
